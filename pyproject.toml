[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-as-code"
version = "0.1.0"
description = "GovernedAction/v1 receipt format, CI gates, and the 12-step governed-action demo. Give away the format; sell the control plane."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
keywords = ["ai-governance", "receipts", "dsse", "ed25519", "policy-as-code"]
classifiers = [
  "Intended Audience :: Developers",
  # FlightRecorder locks with fcntl.flock, which exists only on POSIX systems.
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Quality Assurance",
]
# Exact pins mirror requirements.txt (tests/test_ci_requirements.py checks it).
dependencies = ["cryptography==50.0.2", "huggingface-hub==2.4.0", "pyyaml==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://a-11-oy.com"
Source = "https://github.com/szl-holdings/governance-as-code"
Issues = "https://github.com/szl-holdings/governance-as-code/issues"

[tool.setuptools]
# Source-checkout project: tools/, demo/, examples/ and tests/ run from a clone
# and locate schemas/, data/ and governance/ relative to it, so the built wheel
# carries metadata and dependency pins only. `pip install -e '.[test]'` prepares
# a clone; nothing here is importable from site-packages.
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
