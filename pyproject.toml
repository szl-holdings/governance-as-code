[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-as-code"
version = "0.1.0"
description = "GovernedAction/v1 receipt format, CI gates, and the 12-step governed-action demo. Give away the format; sell the control plane."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = ["cryptography==50.0.1", "huggingface-hub==2.0.0", "pyyaml==6.0.3", "jsonschema==4.26.0"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/governance-as-code"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
