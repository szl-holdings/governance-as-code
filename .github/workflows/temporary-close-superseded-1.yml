name: temporary-close-superseded-1

on:
  push:
    branches:
      - chore/p1-1-add-apache-license
    paths:
      - .github/workflows/temporary-close-superseded-1.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  close-when-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/p1-1-add-apache-license
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for current-master successor
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 95); do
            merged_at="$(gh api repos/szl-holdings/governance-as-code/pulls/2 --jq '.merged_at // empty' 2>/dev/null || true)"
            if [ -n "$merged_at" ]; then
              gh pr close 1 --repo szl-holdings/governance-as-code --comment "Superseded by protected merge #2, rebuilt on current master with the exact four-path legal and pinned-workflow contract plus all governance gates."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Successor #2 has not merged within the bounded wait; original PR remains open."
          exit 1
      - name: Remove watcher from branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          rm .github/workflows/temporary-close-superseded-1.yml
          git add -A
          git commit -m "chore(ci): remove superseded-PR watcher" -m "Signed-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:chore/p1-1-add-apache-license
