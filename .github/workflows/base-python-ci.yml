# Standard Python gate for the szl-holdings estate: ruff + pytest on the two
# supported interpreters. Installed by the szl-alignment engine (only into
# repos where Python is detected); keep in sync with
# alignment/templates/workflows/base-python-ci.yml.
#
# Repo-local deviation (2026-11-06): every install comes from the hash-locked
# requirements/ci/base-python-ci.txt (OpenSSF Scorecard Pinned-Dependencies),
# and the project itself is installed with --no-deps --no-build-isolation so
# nothing is fetched outside that lock. The template's unhashed
# `pip install ruff pytest` / `-r requirements.txt` steps are replaced; the
# defer marker and blocking scopes are unchanged.
name: base-python-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchain and dependencies (hash-locked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/base-python-ci.txt

      - name: Install the package
        run: |
          set -euo pipefail
          if [ -f .github/base-python-ci.defer ]; then
            reason="$(head -n 1 .github/base-python-ci.defer)"
            if [ -z "${reason//[[:space:]]/}" ]; then
              echo "::error::.github/base-python-ci.defer must state a non-empty reason on its first line"
              exit 1
            fi
            echo "::notice::Install deferred to repo-specific CI: ${reason}"
            exit 0
          fi
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      # Blocking scope is the classes that indicate real breakage (syntax
      # errors, undefined names, unused imports). The full default ruleset runs
      # non-blocking so repos keep visibility without a forced flag day; repos
      # with their own ruff config in pyproject.toml already get stricter
      # behavior from their primary CI.
      - name: "Ruff (blocking: E9/F)"
        run: ruff check . --output-format github --select E9,F

      - name: Ruff (full ruleset, informational)
        run: ruff check . --statistics --exit-zero

      # The base gate owns tests/ only. Suites living elsewhere (scripts/,
      # tools/) are exercised by each repo's dedicated workflows with their
      # own dependency pins; collecting them here would fail on imports this
      # minimal install does not provide. Repos with no tests/ skip honestly.
      - name: Pytest (blocking)
        run: |
          set -euo pipefail
          if [ -f .github/base-python-ci.defer ]; then
            reason="$(head -n 1 .github/base-python-ci.defer)"
            if [ -z "${reason//[[:space:]]/}" ]; then
              echo "::error::.github/base-python-ci.defer must state a non-empty reason on its first line"
              exit 1
            fi
            echo "::notice::Tests deferred to repo-specific CI: ${reason}"
            exit 0
          fi
          if [ -d tests ]; then
            pytest -q tests
          else
            echo "::notice::No tests/ directory; base gate defers to repo-specific suites."
          fi
