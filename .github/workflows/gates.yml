name: governance-gates
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Node runs demo_site/verify.js for tests/test_browser_verifier_parity.py.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install gate dependencies (hash-locked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/gates.txt
      - name: Lexicon gate (Zero-Bandaid vocabulary)
        run: python3 tools/lexicon_gate.py
      - name: Demo harness (12-step acceptance test)
        run: python3 demo/demo_harness.py
      - name: Offline demo-bundle verification
        run: python3 examples/verify_demo_bundle.py receipts/demo_bundle.json
      - name: Offline verifier and unsigned-receipt contracts
        env:
          # The browser-parity test must run here, never skip for a missing node.
          GOVERNANCE_REQUIRE_NODE: "1"
        run: >-
          python3 -m pytest -q
          tests/test_unsigned_receipt.py
          tests/test_demo_bundle_verifier.py
          tests/test_receipt_schema.py
          tests/test_flight_recorder_initialization.py
          tests/test_kanchay_projection.py
          tests/test_raise_gate_workflow.py
          tests/test_credo_governor.py
          tests/test_credo_evidence_admission.py
          tests/test_forbidden_domain_gate.py
          tests/test_browser_verifier_parity.py
          tests/test_ci_requirements.py
          tests/test_release_gate.py
      - name: Adversarial suite (16 attack classes must never PASS)
        run: python3 tests/adversarial_suite.py
      - name: Spaces audit (READ_ONLY, self-receipting)
        run: python3 tools/spaces_audit.py
      - name: Release gate
        run: python3 tools/release_gate.py
      - name: Raise gate (report-only in CI; founder supplies commercial facts)
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 tools/release_gate.py --raise || rc=$?
          case "$rc" in
            0) ;;
            2) echo "::notice::Raise remains blocked by unknown founder-supplied facts (report-only)." ;;
            *) echo "::error::Raise gate failed unexpectedly (exit $rc)."; exit "$rc" ;;
          esac
